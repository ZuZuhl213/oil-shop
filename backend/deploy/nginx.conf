# Reference edge for a self-hosted Next frontend. Vercel requires equivalent
# platform rules before public launch. This edge must receive the TCP client
# directly; do not trust client-supplied X-Forwarded-For or X-Real-IP.
events {}
http {
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=orders:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=vouchers:10m rate=60r/m;
    limit_req_status 429;
    upstream storefront { server frontend:3000; }
    server {
        listen 8080;
        # TLS terminates here in production; supply the real domain/certificate.
        client_max_body_size 1m;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_read_timeout 30s;
        error_page 429 = @rate_limited;
        error_page 413 = @body_too_large;
        location = /api/v1/admin/auth/login {
            limit_req zone=login burst=9 nodelay;
            proxy_pass http://storefront;
        }
        location = /api/v1/orders {
            limit_req zone=orders burst=19 nodelay;
            proxy_pass http://storefront;
        }
        location = /api/v1/vouchers/validate {
            limit_req zone=vouchers burst=59 nodelay;
            proxy_pass http://storefront;
        }
        location = /api/v1/admin/media {
            client_max_body_size 6m;
            proxy_pass http://storefront;
        }
        location / { proxy_pass http://storefront; }
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 60 always;
            add_header Cache-Control no-store always;
            return 429 '{"code":"RATE_LIMITED","message":"Too many requests","fieldErrors":{},"traceId":"$request_id"}';
        }
        location @body_too_large {
            default_type application/json;
            return 413 '{"code":"REQUEST_TOO_LARGE","message":"Request body is too large","fieldErrors":{},"traceId":"$request_id"}';
        }
    }
}
