spring:
  application:
    name: oil-shop-api
  datasource:
    url: jdbc:${DB_CONNECTION:postgresql}://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:oil_shop}
    username: ${DB_USERNAME:oil_shop}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        path: /api
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    custom-css: /swagger-custom.css
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    filter: true
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
