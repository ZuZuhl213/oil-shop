spring:
  application:
    name: oil-shop-api
  datasource:
    url: jdbc:${DB_CONNECTION:postgresql}://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:oil_shop}
    username: ${DB_USERNAME:oil_shop}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  sheets:
    enabled: ${GOOGLE_SHEETS_SYNC_ENABLED:false}
    spreadsheet-id: ${GOOGLE_SHEETS_SPREADSHEET_ID:}
    credentials-path: ${GOOGLE_SHEETS_CREDENTIALS_PATH:}
    poll-delay-ms: ${GOOGLE_SHEETS_POLL_DELAY_MS:5000}
  media:
    provider: ${MEDIA_PROVIDER:supabase}
    r2:
      endpoint: ${R2_ENDPOINT:}
      bucket: ${R2_BUCKET:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      public-base-url: ${R2_PUBLIC_BASE_URL:}
    supabase-url: ${SUPABASE_URL:}
    bucket: ${SUPABASE_MEDIA_BUCKET:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        path: /api
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    custom-css: /swagger-custom.css
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    filter: true
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
