spring:
  application:
    name: oil-shop-api
  datasource:
    url: jdbc:${DB_CONNECTION:postgresql}://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:oil_shop}
    username: ${DB_USERNAME:oil_shop}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
