springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  forward-headers-strategy: framework
  shutdown: graceful
  tomcat:
    connection-timeout: 5s

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_DATABASE}?sslmode=${DB_SSL_MODE:verify-full}
    username: ${DB_USERNAME}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
      validation-timeout: 2000
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  security:
    allowed-origins: ${APP_SECURITY_ALLOWED_ORIGINS}
