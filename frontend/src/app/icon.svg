<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D4D38"/>
      <stop offset="45%" stop-color="#26402F"/>
      <stop offset="100%" stop-color="#182B1F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3CA8A"/>
      <stop offset="55%" stop-color="#C88B3A"/>
      <stop offset="100%" stop-color="#A76E23"/>
    </linearGradient>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#bgGrad)" stroke="#C88B3A" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Inner subtle border -->
  <rect x="28" y="28" width="456" height="456" rx="108" ry="108" fill="none" stroke="#C88B3A" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- HM Text -->
  <text x="256" y="335"
        text-anchor="middle"
        font-family="'Playfair Display', Georgia, serif"
        font-weight="800"
        font-size="240"
        letter-spacing="-7"
        fill="url(#goldGrad)"
        filter="url(#textGlow)">HM</text>
</svg>
