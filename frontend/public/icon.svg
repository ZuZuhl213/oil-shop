<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="42%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#B45309" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Radiant Golden Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="128" ry="128" fill="url(#goldBg)"/>

  <!-- Inner Pure White Glass Rim -->
  <rect x="26" y="26" width="460" height="460" rx="118" ry="118" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Crisp White HM Typography with breathing room -->
  <text x="256" y="325"
        text-anchor="middle"
        font-family="'Playfair Display', Georgia, serif"
        font-weight="800"
        font-size="205"
        letter-spacing="-3"
        fill="#FFFFFF"
        filter="url(#shadowGlow)">HM</text>
</svg>
