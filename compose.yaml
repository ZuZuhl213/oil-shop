services:
  db:
    image: postgres:17.10-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oil_shop}
      POSTGRES_USER: ${POSTGRES_USER:-oil_shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oil_shop_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
